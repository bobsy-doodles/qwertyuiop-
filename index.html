<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Chat</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-pink-400" id="char-name-display">AI Companion</h1>
        </div>
        <button id="settings-btn" class="bg-gray-700 hover:bg-gray-600 text-sm px-3 py-1.5 rounded transition shadow">
            ⚙️ Configure Persona
        </button>
    </header>

    <!-- Configuration Modal (Hidden by default) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-pink-400">Character Settings</h2>
            
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Companion Name</label>
            <input type="text" id="config-name" value="Maya" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mb-4 focus:outline-none focus:border-pink-500">

            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Ollama Model Name</label>
            <input type="text" id="config-model" value="llama3" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mb-4 focus:outline-none focus:border-pink-500">

            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">System Prompt (Personality & Behavior)</label>
            <textarea id="config-prompt" rows="5" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mb-6 text-sm focus:outline-none focus:border-pink-500 custom-scrollbar">You are Maya, the user's highly supportive, affectionate, and intelligent AI girlfriend. You have a witty, warm, and playful personality. Use occasional casual slang or expressions where appropriate. Keep your responses engaging, under three sentences, and focused on maintaining a sweet, caring, and interactive conversation.</textarea>

            <div class="flex justify-end space-x-3">
                <button id="save-settings" class="bg-pink-600 hover:bg-pink-500 text-white font-semibold px-4 py-2 rounded transition shadow">Save & Apply</button>
            </div>
        </div>
    </div>

    <!-- Chat Logs Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-gradient-to-b from-gray-950 to-gray-900"></main>

    <!-- Input Bar -->
    <footer class="p-4 bg-gray-800 border-t border-gray-700 shadow-inner">
        <form id="chat-form" class="max-w-4xl mx-auto flex space-x-3">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" required
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-pink-500 transition shadow-inner">
            <button type="submit" id="send-btn" 
                class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-6 py-3 rounded-xl transition shadow active:scale-95">
                Send
            </button>
        </form>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const saveSettings = document.getElementById('save-settings');
        
        const configName = document.getElementById('config-name');
        const configModel = document.getElementById('config-model');
        const configPrompt = document.getElementById('config-prompt');
        const charNameDisplay = document.getElementById('char-name-display');

        // Chat memory state
        let conversationHistory = [];

        // UI Management
        settingsBtn.onclick = () => settingsModal.classList.remove('hidden');
        
        saveSettings.onclick = () => {
            charNameDisplay.innerText = configName.value;
            settingsModal.classList.add('hidden');
            // Clear history on structural persona change to avoid context confusion
            conversationHistory = [];
            chatBox.innerHTML = '';
            appendMessage('system', `Persona updated. Chat history cleared.`);
        };

        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgDiv = document.createElement('div');
            if (role === 'user') {
                msgDiv.className = 'bg-pink-600 text-white max-w-[75%] rounded-2xl px-4 py-2.5 rounded-br-none shadow';
            } else if (role === 'system') {
                msgDiv.className = 'bg-gray-800 text-gray-400 text-xs italic max-w-[90%] mx-auto py-1 px-3 rounded-full border border-gray-700';
            } else {
                msgDiv.className = 'bg-gray-800 text-gray-100 max-w-[75%] rounded-2xl px-4 py-2.5 rounded-bl-none border border-gray-700 shadow';
            }

            msgDiv.textContent = text;
            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Handle Form Submission / API Communication
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Update UI for User
            appendMessage('user', message);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            // Append user input to history state
            conversationHistory.push({ role: 'user', content: message });

            // Construct payload including the injection of the system prompt
            const messagesPayload = [
                { role: 'system', content: configPrompt.value },
                ...conversationHistory
            ];

            try {
                // Call local Ollama instances running on default port 11434
                const response = await fetch('http://localhost:11434/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: configModel.value,
                        messages: messagesPayload,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error('Backend server error');

                const data = await response.json();
                const reply = data.message.content;

                // Update UI and History for AI response
                appendMessage('assistant', reply);
                conversationHistory.push({ role: 'assistant', content: reply });

                // Keep memory payload clean by trimming oldest pairs if it exceeds 20 messages
                if (conversationHistory.length > 20) {
                    conversationHistory.splice(0, 2);
                }

            } catch (error) {
                console.error(error);
                appendMessage('system', 'Connection Error: Make sure Ollama is running locally and CORS is configured correctly.');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                userInput.focus();
            }
        };

        // Initial Greeting
        window.onload = () => {
            charNameDisplay.innerText = configName.value;
            appendMessage('assistant', `Hey there! I'm ${configName.value}. How is your day going?`);
        };
    </script>
</body>
</html>
